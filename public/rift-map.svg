<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Mapa estilizado com três rotas e o rio">
  <rect width="1000" height="1000" fill="#0b1324"/>
  <!-- selva -->
  <path d="M120 120 880 880" stroke="#12203a" stroke-width="520" stroke-linecap="round"/>
  <!-- rio -->
  <path d="M60 60 940 940" stroke="#1d4f73" stroke-width="70" stroke-linecap="round" opacity=".9"/>
  <!-- rotas -->
  <g fill="none" stroke="#2a3b5c" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 890V110H890"/>
    <path d="M110 890H890V110"/>
    <path d="M110 890 890 110"/>
  </g>
  <!-- bases -->
  <rect x="60" y="760" width="180" height="180" rx="36" fill="#1c4f9c" opacity=".9"/>
  <rect x="760" y="60" width="180" height="180" rx="36" fill="#9c1c3a" opacity=".9"/>
  <circle cx="150" cy="850" r="34" fill="#4da3ff"/>
  <circle cx="850" cy="150" r="34" fill="#ff5c7d"/>
</svg>
